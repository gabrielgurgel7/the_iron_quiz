<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>THE IRON QUIZ</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/script.js" defer></script>

  <body>
    <main>
      <header id="main-header">
        <img id="logo" src="assets/imgs/svg/logo_iron_quiz.svg" alt="" />
        <div class="container-checkbox">
          <label class="switch" for="sound-on-off">
            <span class="switch-text">Som</span>
            <div class="switch-wrapper">
              <input id="sound-on-off" type="checkbox" name="sound-on-off" />
              <span class="switch-button"></span>

          </label>
        </div>
      </header>
      <section id="hero">
        <h1 style="font-style: oblique">
          Você sobreviveria <br />
          em Westeros?
        </h1>
        <p>Escolha sua casa e teste seus conhecimentos</p>
        <a id="link-start-game" href="pages/houses.html">Começar</a>
      </section>
    </main>
    <footer id="main-footer">
      <h3>Créditos</h3>
      <p><small>Projeto experiemtal sem fins comerciais.</small></p>
      <p>
        <small><strong>Música:</strong> The Point End - Ramin Djawadi</small>
      </p>
    </footer>
